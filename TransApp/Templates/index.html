<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translate</title>
    <script src="https://kit.fontawesome.com/2539c09690.js" crossorigin="anonymous"></script>
    <style>
       @media (max-width: 768px) {
        .home{
            width: 100%;
            height: 150vh;
            padding: 0;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* .txtarea{
            background-color: white;
            border: 1px solid grey;
            border-radius: 5px;
            width: 90%;
        } */
        .txtarea input{
            border: none;
            width: 90%;
            height: 70px;
            border: 1px solid grey;
            border-radius: 5px;
            margin: 0 auto;
        }
        button{
            border: none;
            padding: 15px;
            margin: 10px;
        }
        .wht{
            background-color: white;
            border: 1px solid grey;
            border-radius: 25px;
        }
        .gre{
            background-color: #1F6F5C;
            color: white;
            border-radius: 25px;
        }
        #big-btn{
            width: 98%;
            background-color: #1F6F5C;
            color: white;
            border-radius: 10px;
            margin: 0, auto;
            font-weight: bold;
            font-size: large;
        }
        .lang{
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        .lang div{
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            background-color: white;
            width: 90%;
            border-radius: 20px;
        }
        footer{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-top: 30px;
            background-color: white;
            border-top: 1px solid grey;
        }
        /* footer div{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0;
        } */
       } 
    </style>
</head>
<body>
    <section class="home" style="background-color: #F7F6F2;">
        <h2>Translate</h2>
        <section class="txtarea">
            <input type="text" placeholder="English">
        </section>
        <section>
            <div>
                <p>Tone</p>
                <button class="wht">Formal</button><button class="gre">Casual</button>
                
            </div>
            <div>
                <p>Translate into</p>
                <button class="gre">Yoruba</button><button class="gre">Hausa</button><button class="gre">Igbo</button><button class="wht">Pidgin</button><button class="wht">French</button>
            </div>
        </section>
        <button id="big-btn">Translate</button>
        <section class="lang">
            <div>
                <span>Yoruba <br> <h3>Bawo ni se wa?</h3></span>
                <i class="fa-solid fa-bookmark"></i>
                <i class="fa-solid fa-volume-low"></i>
            </div>
            <div>
                <span>Yoruba <br> <h3>Bawo ni se wa?</h3></span>
                <i class="fa-solid fa-bookmark"></i>
                <i class="fa-solid fa-volume-low"></i>
            </div>
            <div>
                <span>Yoruba <br> <h3>Bawo ni se wa?</h3></span>
                <i class="fa-solid fa-bookmark"></i>
                <i class="fa-solid fa-volume-low"></i>
            </div>
        </section>
        <footer>
            <div>
                <i class="fa-solid fa-volume-low"></i>
                <p>Translate</p>
            </div>
            <div>
                <i class="fa-solid fa-globe"></i>
                <p>Practice</p>
            </div>
            <div>
                <i class="fa-solid fa-box"></i>
                <p>Phrasebook</p>
            </div>
        </footer>
    </section>
</body>
</html>
